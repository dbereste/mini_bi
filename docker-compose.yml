services:
  app:
    image: mini-bi:1.0
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Your working copy of the code
      - ./:/var/www/html
      # Keep the image's vendor/ and database (named volumes are seeded from the image)
      - vendor:/var/www/html/vendor
      - data:/data

volumes:
  vendor:
  data:
